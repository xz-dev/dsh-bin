name: Scoop manager lifecycle

# Real user-local Scoop lifecycle using binaries built from this checkout; no published release needed.
on:
  workflow_call:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  scoop:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: mlugg/setup-zig@v2
        with: { version: "0.15.2" }
      - name: Install real Scoop in an isolated user-local root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $homeDir = Join-Path $env:RUNNER_TEMP 'dsh-scoop-user'
          if (Test-Path $homeDir) { throw "scratch HOME already exists: $homeDir" }
          New-Item -ItemType Directory $homeDir | Out-Null
          $env:HOME = $homeDir
          $env:USERPROFILE = $homeDir
          $env:LOCALAPPDATA = Join-Path $homeDir 'local'
          $env:APPDATA = Join-Path $homeDir 'roaming'
          $env:XDG_CONFIG_HOME = Join-Path $homeDir 'config'
          $env:SCOOP = Join-Path $homeDir 'scoop'
          $env:SCOOP_GLOBAL = Join-Path $homeDir 'scoop-global'
          $env:TMPDIR = $env:RUNNER_TEMP
          $env:DSH_SCOOP_TEST_HOME = $homeDir
          foreach ($key in @('HOME','USERPROFILE','LOCALAPPDATA','APPDATA','XDG_CONFIG_HOME','SCOOP','SCOOP_GLOBAL','TMPDIR','DSH_SCOOP_TEST_HOME')) {
            "$key=$([Environment]::GetEnvironmentVariable($key))" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Invoke-WebRequest 'https://get.scoop.sh' -OutFile (Join-Path $homeDir 'install.ps1')
          # Hosted Windows account is administrative; -RunAsAdmin allows user-local install, not --global.
          & (Join-Path $homeDir 'install.ps1') -RunAsAdmin -ScoopDir $env:SCOOP -ScoopGlobalDir $env:SCOOP_GLOBAL
          if ($LASTEXITCODE -ne 0) { throw "Scoop bootstrap failed: $LASTEXITCODE" }
          $env:PATH = "$(Join-Path $env:SCOOP 'shims');$env:PATH"
          (Join-Path $env:SCOOP 'shims') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          scoop config aria2-enabled false
          if ($LASTEXITCODE -ne 0) { throw 'Scoop configuration failed' }
          scoop config last_update ([DateTime]::Now.ToString('o'))
          if ($LASTEXITCODE -ne 0) { throw 'Scoop configuration failed' }
      - name: PS-SCOOP and DL-MANAGED real install upgrade uninstall
        working-directory: dsh-manager
        shell: pwsh
        env: { DSH_SCOOP_TEST: "1" }
        run: |
          bun test ./test/scoop-lifecycle.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
