name: build

# One distribution build (8.1–8.4): 12 targets on native runners → acceptance + packaged E2E with no
# Node on PATH, including a new slot's candidate office addon (8.9) → the accepted addon's release and
# index entry, then the bundle's immutable GitHub Release (Latest = release channel) → append to the
# releases index → Scoop bucket. Publication happens only when upstream-poll calls this with `publish: true`; a manual
# dispatch is always the dry run (builds and tests everything, publishes nothing).
on:
  workflow_dispatch:
    inputs:
      channel: { description: "live or release", required: true, type: choice, options: [live, release] }
      upstream: { description: "dsh-v* tag (release) or master / commit (live)", required: true, type: string }
  workflow_call:
    inputs:
      channel: { required: true, type: string }
      upstream: { required: true, type: string }
      publish: { required: false, type: boolean, default: false }

permissions: {}

env:
  BUN_VERSION: "1.4.2"
  ZIG_VERSION: "0.15.2"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      commit: ${{ steps.p.outputs.commit }}
      slot: ${{ steps.p.outputs.slot }}
      addon: ${{ steps.p.outputs.addon }}
      # Artifact-name prefix: upstream-poll calls this workflow several times in one run, and artifact
      # names are run-scoped, so every build's artifacts carry its own channel and commit.
      key: ${{ steps.p.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - id: p
        shell: bash
        env: { CHANNEL: "${{ inputs.channel }}", UPSTREAM: "${{ inputs.upstream }}" }
        run: |
          set -euo pipefail
          case "$CHANNEL:$UPSTREAM" in release:dsh-v*|live:master|live:*) ;; *) echo "bad channel/upstream: $CHANNEL $UPSTREAM" >&2; exit 1 ;; esac
          if [[ "$UPSTREAM" =~ ^[0-9a-f]{40}$ ]]; then commit=$UPSTREAM; else commit=$(bun scripts/fetch-upstream.mjs "$UPSTREAM" | jq -r .commit); fi
          slot=$(bun scripts/addon-slot.mjs "$RUNNER_TEMP/upstream.git" "$commit")
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/releases/index.json" -o "$RUNNER_TEMP/index.json" || echo '{"schemaVersion":1,"channels":{"release":[],"live":[]},"addons":{"office":[]}}' > "$RUNNER_TEMP/index.json"
          addon=$(jq --argjson s "$slot" '$s != null and ([.addons.office[] | select(.slot.commit == $s.commit)] | length == 0)' "$RUNNER_TEMP/index.json")
          { echo "commit=$commit"; echo "key=$CHANNEL-$commit"; echo "slot=$slot"; echo "addon=$addon"; echo "matrix=$(bun scripts/targets.mjs --matrix)"; } >> "$GITHUB_OUTPUT"

  addon:
    needs: prepare
    if: needs.prepare.outputs.addon == 'true'
    permissions: { contents: read }
    uses: ./.github/workflows/addon.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}

  build-target:
    needs: [prepare, addon]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.addon.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ env.ZIG_VERSION }}" }
      - name: Build ${{ matrix.id }}
        shell: bash
        env: { CHANNEL: "${{ inputs.channel }}", COMMIT: "${{ needs.prepare.outputs.commit }}", UPSTREAM: "${{ inputs.upstream }}", IMAGE: "${{ matrix.containerImage }}", GH_TOKEN: "${{ github.token }}", ADDON_MANIFEST: "${{ needs.addon.outputs.manifest }}", DSH_BIN_PUBLISHED_AT: "${{ needs.addon.outputs.published-at }}" }
        run: |
          set -euo pipefail
          # Index snapshot for the embedded addon table, plus this slot's candidate addon when there is
          # one: publish appends the identical entry (same manifest and publishedAt) before the bundle.
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/releases/index.json" -o "$RUNNER_TEMP/index.json" || rm -f "$RUNNER_TEMP/index.json"
          if [[ -n "$ADDON_MANIFEST" ]]; then printf '%s' "$ADDON_MANIFEST" > "$RUNNER_TEMP/addon-manifest.json"; bun scripts/index.mjs append-addon "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/addon-manifest.json"; fi
          ref=$COMMIT; [[ "$CHANNEL" == release ]] && ref=$UPSTREAM
          args=('${{ matrix.id }}' "$CHANNEL" "$ref" "$RUNNER_TEMP/out" --run "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT" --index "$RUNNER_TEMP/index.json" --work "$RUNNER_TEMP/work" --git-dir "$RUNNER_TEMP/upstream.git")
          if [[ -z "$IMAGE" ]]; then
            bun scripts/build-target.mjs "${args[@]}"
          else
            # musl: build inside the pinned native musl userspace (same images as xz-dev/pi); cmake builds
            # koffi from source where it ships no musl prebuild (arm64). The
            # workspace and RUNNER_TEMP are mounted at identical paths, so arguments need no rewriting.
            zig=$(dirname "$(command -v zig)")
            docker run --rm -v "$PWD:$PWD" -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$zig:/opt/zig:ro" -w "$PWD" -e GITHUB_REPOSITORY -e GH_TOKEN -e DSH_BIN_LAUNCHER_COMMIT="$GITHUB_SHA" -e OWNER="$(id -u):$(id -g)" -e RUNNER_TEMP "$IMAGE" sh -euc \
              'apk add --no-cache bash git curl nodejs nodejs-dev npm python3 build-base cmake linux-headers github-cli >/dev/null; ln -sf /usr/bin/gcc /usr/local/bin/musl-gcc; PATH=/opt/zig:$PATH bun scripts/build-target.mjs "$@"; chown -R "$OWNER" "$RUNNER_TEMP" "$PWD"' sh "${args[@]}"
          fi
          rm -rf "$RUNNER_TEMP/out/addon-tree" "$RUNNER_TEMP/out"/.scratch-*
      - uses: actions/upload-artifact@v4
        with: { name: "${{ needs.prepare.outputs.key }}-target-${{ matrix.id }}", path: "${{ runner.temp }}/out/", if-no-files-found: error, retention-days: 14, overwrite: true }

  # Jobs downstream of the optional `addon` job need explicit conditions: the implicit success() fails
  # when any ancestor was skipped, which would silently skip the whole release when the slot has an addon.
  accept:
    needs: [prepare, addon, build-target]
    if: ${{ !cancelled() && needs.build-target.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/download-artifact@v4
        with: { name: "${{ needs.prepare.outputs.key }}-target-${{ matrix.id }}", path: "${{ runner.temp }}/cand" }
      - uses: actions/download-artifact@v4
        if: needs.addon.result == 'success'
        with: { name: "addon-office-${{ needs.prepare.outputs.commit }}", path: "${{ runner.temp }}/addon-cand" }
      - name: Fixture index with the previous published version and the candidate
        shell: bash
        env: { CHANNEL: "${{ inputs.channel }}", DSH_BIN_PUBLISHED_AT: "${{ needs.addon.outputs.published-at }}" }
        run: |
          set -euo pipefail
          c="$RUNNER_TEMP/cand"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/releases/index.json" -o "$c/index.json" || echo '{"schemaVersion":1,"channels":{"release":[],"live":[]},"addons":{"office":[]}}' > "$c/index.json"
          # Exact-tag downloads (not the API): the previous published asset for this target, and this
          # platform's addon assets.
          prev=$(jq -r --arg ch "$CHANNEL" --arg t '${{ matrix.id }}' '[.channels[$ch][] | select(.assets[$t])] | max_by(.seq) // empty | "\(.tag)/\(.assets[$t].name)"' "$c/index.json")
          if [[ -n "$prev" ]]; then mkdir -p "$c/$(dirname "$prev")"; curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$prev" -o "$c/$prev"; fi
          platform=$(bun -e "import {addonPlatform} from './runtime/update/addon-resolve.ts'; console.log(addonPlatform('${{ matrix.id }}'))")
          for a in $(jq -r --arg p "$platform" '.addons.office[] | select(.assets[$p]) | "\(.tag)/\(.assets[$p].name)"' "$c/index.json"); do mkdir -p "$c/$(dirname "$a")"; curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$a" -o "$c/$a"; done
          # This slot's candidate addon (8.9): served from the fixture like a published one, so the E2E
          # installs and boots it before anything is released.
          a="$RUNNER_TEMP/addon-cand"
          if [[ -f "$a/addon-manifest.json" ]]; then
            tag=$(jq -r .tag "$a/addon-manifest.json"); file=$(jq -r --arg p "$platform" '.assets[$p].file' "$a/addon-manifest.json")
            mkdir -p "$c/$tag"; mv "$a/$file" "$c/$tag/$file"
            bun scripts/index.mjs append-addon "$c/index.json" "$a/addon-manifest.json"
          fi
          shopt -s nullglob; manifests=("$c"/dsh-*.json); shopt -u nullglob
          if (( ${#manifests[@]} != 1 )); then echo "::error::expected one release manifest in the target artifact, found ${#manifests[@]}"; exit 1; fi
          bun scripts/index.mjs append-bundle "$c/index.json" "${manifests[0]}"
      - name: Packaged E2E (no Node on PATH)
        if: ${{ !matrix.containerImage }}
        shell: bash
        env: { CHANNEL: "${{ inputs.channel }}" }
        run: bun scripts/e2e.mjs "$RUNNER_TEMP/cand/index.json" "$RUNNER_TEMP/cand" --target '${{ matrix.id }}' --channel "$CHANNEL"
      - name: Packaged E2E in the pinned musl userspace
        if: matrix.containerImage
        shell: bash
        env: { IMAGE: "${{ matrix.containerImage }}", CHANNEL: "${{ inputs.channel }}" }
        run: docker run --rm -v "$PWD:$PWD:ro" -v "$RUNNER_TEMP/cand:$RUNNER_TEMP/cand" -w "$PWD" "$IMAGE" sh -euc 'apk add --no-cache git >/dev/null; bun scripts/e2e.mjs "$1/index.json" "$1" --target "$2" --channel "$3"' sh "$RUNNER_TEMP/cand" '${{ matrix.id }}' "$CHANNEL"

  aggregate:
    needs: [prepare, accept]
    if: ${{ !cancelled() && needs.accept.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: "${{ needs.prepare.outputs.key }}-target-*", path: "${{ runner.temp }}/release", merge-multiple: true }
      - run: bun scripts/aggregate-release.mjs "$RUNNER_TEMP/release" --expect-targets 12
      - uses: actions/upload-artifact@v4
        with: { name: "${{ needs.prepare.outputs.key }}-release", path: "${{ runner.temp }}/release/", if-no-files-found: error, retention-days: 14, overwrite: true }

  publish:
    needs: [prepare, addon, aggregate]
    if: ${{ !cancelled() && needs.aggregate.result == 'success' && inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    concurrency: { group: releases-index, cancel-in-progress: false }
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/download-artifact@v4
        with: { name: "${{ needs.prepare.outputs.key }}-release", path: "${{ runner.temp }}/release" }
      - uses: actions/download-artifact@v4
        if: needs.addon.result == 'success'
        with: { name: "addon-office-${{ needs.prepare.outputs.commit }}", path: "${{ runner.temp }}/addon" }
      # The accepted candidate addon is released and indexed first: the bundle pins it.
      - id: attest-addon
        if: needs.addon.result == 'success'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ runner.temp }}/addon/*.zip
            ${{ runner.temp }}/addon/addon-manifest.json
      - name: Publish and index the accepted addon
        if: needs.addon.result == 'success'
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}", BUNDLE: "${{ steps.attest-addon.outputs.bundle-path }}", DSH_BIN_PUBLISHED_AT: "${{ needs.addon.outputs.published-at }}" }
        run: |
          set -euo pipefail
          empty="$RUNNER_TEMP/empty-gh"; mkdir -p "$empty"
          for f in "$RUNNER_TEMP"/addon/*.zip "$RUNNER_TEMP/addon/addon-manifest.json"; do
            GH_CONFIG_DIR="$empty" GH_TOKEN='' GITHUB_TOKEN='' gh attestation verify "$f" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" --deny-self-hosted-runners
          done
          bun scripts/publish-release.mjs "$RUNNER_TEMP/addon/addon-manifest.json"
          scripts/publish-index.sh addon "$RUNNER_TEMP/addon/addon-manifest.json"
      - id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/release-manifest.json
            ${{ runner.temp }}/release/SHA256SUMS
      - name: Verify attestations with empty gh credentials
        shell: bash
        env: { BUNDLE: "${{ steps.attest.outputs.bundle-path }}" }
        run: |
          set -euo pipefail
          empty="$RUNNER_TEMP/empty-gh"; mkdir -p "$empty"
          for f in "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP/release/release-manifest.json" "$RUNNER_TEMP/release/SHA256SUMS"; do
            GH_CONFIG_DIR="$empty" GH_TOKEN='' GITHUB_TOKEN='' gh attestation verify "$f" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" --deny-self-hosted-runners
          done
      - name: Publish immutable release (Latest only for the release channel)
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: bun scripts/publish-release.mjs "$RUNNER_TEMP/release/release-manifest.json"
      - name: Append to the releases index
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: scripts/publish-index.sh bundle "$RUNNER_TEMP/release/release-manifest.json"
      - name: Update the Scoop bucket
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: scripts/publish-scoop-bucket.sh
