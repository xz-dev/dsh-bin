name: addon

# Office addon candidate (8.8, 8.9): kit closure from the frozen upstream deploy, engine tarballs checked
# against the lockfile sha512, 5 platform zips. This only builds and uploads the candidate; `build`
# accepts it on every target and then publishes the addon before the bundle, so a broken addon never
# becomes an immutable release. A manual dispatch builds the candidate and nothing else.
on:
  workflow_dispatch:
    inputs:
      commit: { description: "upstream commit whose slot needs an addon", required: true, type: string }
  workflow_call:
    inputs:
      commit: { required: true, type: string }
    outputs:
      # The candidate's addon-manifest.json (compact) and the publishedAt its index entry will carry:
      # build-target embeds it in bundle.json, accept installs it, publish appends the same entry.
      manifest: { value: "${{ jobs.addon.outputs.manifest }}" }
      published-at: { value: "${{ jobs.addon.outputs.published-at }}" }

permissions: {}

jobs:
  addon:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      manifest: ${{ steps.build.outputs.manifest }}
      published-at: ${{ steps.build.outputs.published-at }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: mlugg/setup-zig@v2
        with: { version: "0.15.2" }
      - name: Build the addon assets
        id: build
        shell: bash
        env: { COMMIT: "${{ inputs.commit }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP"
          bun scripts/build-target.mjs linux-x64-modern live "$COMMIT" "$t/bundle" --run "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT" --work "$t/work" --git-dir "$t/upstream.git"
          slot=$(bun scripts/addon-slot.mjs "$t/upstream.git" "$COMMIT")
          test "$slot" != null
          identity=$(bun -e "import {addonDistribution} from './scripts/versioning.mjs'; const s=$slot; const d=addonDistribution({kitVersion:s.kitVersion,run:$GITHUB_RUN_NUMBER,attempt:$GITHUB_RUN_ATTEMPT,launcherCommit:'$GITHUB_SHA'}); console.log(JSON.stringify({version:d.version,tag:d.tag,slot:s}))")
          bun scripts/build-addon.mjs "$t/bundle/addon-tree" "$t/work/src" "$t/addon" "$identity"
          { echo "manifest=$(jq -c . "$t/addon/addon-manifest.json")"; echo "published-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: "addon-office-${{ inputs.commit }}", path: "${{ runner.temp }}/addon/", if-no-files-found: error, retention-days: 14, overwrite: true }
