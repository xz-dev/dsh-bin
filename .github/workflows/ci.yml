name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: mlugg/setup-zig@v2
        with: { version: "0.15.2" }
      - name: Install Zsh and Fish (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install Fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Verify preinstalled Zsh (macOS)
        if: runner.os == 'macOS'
        run: zsh --version
      - name: Verify Windows PowerShell and pwsh
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          pwsh.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: dsh-manager
        working-directory: dsh-manager
        run: zig build test && bun test ./test
      # Runtime cases that need a built upstream app skip themselves when work/app is absent.
      - name: dsh-bun-build
        working-directory: dsh-bun-build
        run: bun test ./test/unit ./test/runtime
