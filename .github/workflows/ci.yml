name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_private_only: { description: "Run native Windows private-I/O component gates only; no release or full-app approval", type: boolean, default: false }
      windows_manager_first_use_only: { description: "Run actual Windows manager/config first-use diagnostic; production gate remains closed", type: boolean, default: false }
      release_dry_run: { description: "Build both release artifacts without publishing", type: boolean, default: false }
      manager_version: { type: string, default: "1.0.0-rc.1" }
      runtime_upstream: { type: string, default: "dsh-v0.1.7-rc.2" }
      accepted_manager_run: { description: "Accepted manager dry-run workflow run ID", type: string }
      accepted_manager_artifact: { description: "Accepted manager artifact name (manager-release)", type: string }
      accepted_manager_sha256: { description: "SHA256 of accepted manager-index.json", type: string }
      accepted_runtime_run: { description: "Accepted runtime dry-run workflow run ID", type: string }
      accepted_runtime_artifact: { description: "Accepted runtime artifact name (runtime-release)", type: string }
      accepted_runtime_sha256: { description: "SHA256 of accepted runtime-index.json", type: string }
      e2e_runs: { description: 'Verified dry-run IDs as JSON {"a":"...","b":"...","addon":"..."}', type: string }

permissions: { contents: read }

jobs:
  # Only manual dry runs can call these workflows; publish is always false here.
  # Caller grants cover the skipped publish jobs; every build/verify job explicitly stays read-only.
  # Write permissions belong only to these two calls, never ordinary CI or pull requests.
  manager-release-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run && !inputs.windows_private_only && !inputs.windows_manager_first_use_only
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    uses: ./.github/workflows/manager-release.yml
    with:
      version: ${{ inputs.manager_version }}
      prerelease: true
      publish: false
      accepted_run: ${{ inputs.accepted_runtime_run }}
      accepted_artifact: ${{ inputs.accepted_runtime_artifact }}
      accepted_sha256: ${{ inputs.accepted_runtime_sha256 }}
  runtime-release-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run && !inputs.windows_private_only && !inputs.windows_manager_first_use_only
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    uses: ./.github/workflows/runtime-release.yml
    with:
      channel: release
      upstream: ${{ inputs.runtime_upstream }}
      prerelease: true
      publish: false
      accepted_run: ${{ inputs.accepted_manager_run }}
      accepted_artifact: ${{ inputs.accepted_manager_artifact }}
      accepted_sha256: ${{ inputs.accepted_manager_sha256 }}
  combined-artifact-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run && !inputs.windows_private_only && !inputs.windows_manager_first_use_only && inputs.e2e_runs != ''
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - name: Validate exact artifact run IDs
        env: { E2E_RUNS: "${{ inputs.e2e_runs }}" }
        run: >-
          bun -e 'try { const r = JSON.parse(process.env.E2E_RUNS); if (!["a", "b", "addon"].every(k => typeof r[k] === "string" && /^[0-9]+$/.test(r[k]))) throw new Error(); } catch { console.error("e2e_runs must contain decimal run-ID strings for a, b and addon"); process.exit(1); }'
      - uses: actions/download-artifact@v4
        with:
          name: manager-release
          run-id: ${{ fromJSON(inputs.e2e_runs).a }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/combined-artifacts/a/manager
      - uses: actions/download-artifact@v4
        with:
          name: runtime-release
          run-id: ${{ fromJSON(inputs.e2e_runs).a }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/combined-artifacts/a/runtime
      - uses: actions/download-artifact@v4
        with:
          name: manager-release
          run-id: ${{ fromJSON(inputs.e2e_runs).b }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/combined-artifacts/b/manager
      - uses: actions/download-artifact@v4
        with:
          name: runtime-release
          run-id: ${{ fromJSON(inputs.e2e_runs).b }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/combined-artifacts/b/runtime
      - uses: actions/download-artifact@v4
        with:
          pattern: addon-office-*
          merge-multiple: true
          run-id: ${{ fromJSON(inputs.e2e_runs).addon }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/combined-artifacts/addon
      - name: Two-version combined acceptance (CI artifacts only)
        env:
          DSH_COMBINED_ARTIFACTS: ${{ runner.temp }}/combined-artifacts
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: bun test ./dsh-manager/test/artifact-e2e-combined.test.ts
  windows-manager-first-use:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_manager_first_use_only
    runs-on: windows-2022
    permissions: { contents: read, actions: read }
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: mlugg/setup-zig@v2
        with: { version: "0.15.2" }
      - name: Isolate diagnostic driver state
        shell: bash
        run: >-
          bun -e 'const fs = require("node:fs"), p = require("node:path"), root = p.join(process.env.RUNNER_TEMP, "first-use-driver"); const dirs = { HOME: "home", USERPROFILE: "home", APPDATA: "home/roaming", LOCALAPPDATA: "home/local", XDG_CONFIG_HOME: "config", XDG_CACHE_HOME: "cache", TMPDIR: "tmp", TMP: "tmp", TEMP: "tmp", BUN_INSTALL_CACHE_DIR: "cache/bun", BUN_RUNTIME_TRANSPILER_CACHE_PATH: "cache/transpiler", ZIG_GLOBAL_CACHE_DIR: "cache/zig-global", ZIG_LOCAL_CACHE_DIR: "cache/zig-local" }; for (const [key, name] of Object.entries(dirs)) { const value = p.join(root, name); fs.mkdirSync(value, { recursive: true }); fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`); }'
      - name: Download pinned existing CI artifact (metadata token only)
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'first-use-ci-artifact.zip'
          Invoke-WebRequest 'https://api.github.com/repos/xz-dev/dsh-bin/actions/artifacts/11301612298/zip' -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne 'f121fd6732e7fd38af8823819e18a173d5bc5e3602c804790ac5e83457eedcfc') { throw 'CI artifact digest mismatch' }
      - name: Actual manager creates and selects C, then authentic services run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'first-use-ci-artifact.zip'
          $zig = (Get-Command zig).Source
          $git = (Get-Command git).Source
          bun dsh-manager/test/windows-manager-first-use.native.ts $archive $zig $git
          exit $LASTEXITCODE
      - name: Preserve first-use diagnostic evidence, not product approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-manager-first-use
          path: |
            ${{ runner.temp }}/dsh-manager-first-use-*/*.json
            ${{ runner.temp }}/dsh-manager-first-use-*/*.diff
            ${{ runner.temp }}/dsh-manager-first-use-*/*.stdout
            ${{ runner.temp }}/dsh-manager-first-use-*/*.stderr
          if-no-files-found: warn
  windows-private-io:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_private_only && !inputs.windows_manager_first_use_only
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - name: Native constructor controls (diagnostic only, not acceptance)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-constructor-comparison.log'
          bun dsh-bun-build/scripts/test-windows-private-io.mjs --constructor-compare 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE
      - name: Native private-I/O component gate (15 required cases, no skips)
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-private-io.log'
          bun dsh-bun-build/scripts/test-windows-private-io.mjs 2>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE
      - name: Preserve native component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-private-io-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/windows-private-io.log
            ${{ runner.temp }}/windows-constructor-comparison.log
            ${{ runner.temp }}/dsh-windows-private-io-*/constructor-comparison.json
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/constructor-*
            ${{ runner.temp }}/dsh-windows-private-io-*/native.stdout
            ${{ runner.temp }}/dsh-windows-private-io-*/native.stderr
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/fixture-*.stdout
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/fixture-*.stderr
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/fixture-*.stages
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/fixture-*.request.json
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/fixture-*.result.json
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/private-case-*/control/*.result.json
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/private-case-*/control/*.stages
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/private-case-*/control/*.stdout
            ${{ runner.temp }}/dsh-windows-private-io-*/tmp/private-case-*/control/*.stderr
          if-no-files-found: error
  scoop:
    if: github.event_name != 'workflow_dispatch' || (!inputs.windows_private_only && !inputs.windows_manager_first_use_only)
    uses: ./.github/workflows/scoop-check.yml
  test:
    if: github.event_name != 'workflow_dispatch' || (!inputs.windows_private_only && !inputs.windows_manager_first_use_only)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.2" }
      - uses: mlugg/setup-zig@v2
        with: { version: "0.15.2" }
      - name: Install Zsh and Fish (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install Fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Verify preinstalled Zsh (macOS)
        if: runner.os == 'macOS'
        run: zsh --version
      - name: Verify Windows PowerShell and pwsh
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          pwsh.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Isolate test state
        shell: bash
        run: >-
          bun -e 'const fs = require("node:fs"), p = require("node:path"); const root = p.join(process.env.RUNNER_TEMP, "dsh-ci-test"), home = p.join(root, "home"), cache = p.join(root, "cache"), tmp = p.join(root, "tmp"); const env = { HOME: home, USERPROFILE: home, APPDATA: p.join(home, "roaming"), LOCALAPPDATA: p.join(home, "local"), XDG_CONFIG_HOME: p.join(home, "config"), XDG_DATA_HOME: p.join(home, "data"), XDG_STATE_HOME: p.join(home, "state"), XDG_CACHE_HOME: cache, TMPDIR: tmp, TMP: tmp, TEMP: tmp, ZIG_GLOBAL_CACHE_DIR: p.join(cache, "zig-global"), ZIG_LOCAL_CACHE_DIR: p.join(cache, "zig-local"), BUN_INSTALL_CACHE_DIR: p.join(cache, "bun") }; for (const value of Object.values(env)) fs.mkdirSync(value, { recursive: true }); fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(env).map(([key, value]) => `${key}=${value}\n`).join(""));'
      - name: dsh-manager
        working-directory: dsh-manager
        run: zig build test && bun test ./test
      # Runtime cases that need a built upstream app skip themselves when work/app is absent.
      - name: dsh-bun-build
        working-directory: dsh-bun-build
        run: bun test ./test/unit ./test/runtime
